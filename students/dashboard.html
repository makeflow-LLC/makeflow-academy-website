<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب | MakeFlow Ai Academy</title>
    <link rel="icon" href="../images/logo_trans.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body class="dashboard-body">
    <div class="auth-loading" id="authLoading">
        <div class="spinner"></div>
        <p data-ar="جاري التحقق..." data-en="Verifying...">جاري التحقق...</p>
    </div>

    <div class="dashboard hidden" id="dashboard">
        <div class="student-portal-shell">
            <aside class="student-sidebar">
                <div class="portal-brand">
                    <img src="../images/logo_trans.png" alt="MakeFlow">
                    <div>
                        <strong>MakeFlow Academy</strong>
                        <span data-ar="بوابة الطالب" data-en="Student Portal">بوابة الطالب</span>
                    </div>
                </div>

                <div class="student-profile">
                    <div class="student-avatar" id="studentAvatar">MF</div>
                    <div>
                        <strong id="sidebarUserName"></strong>
                        <span data-ar="طالب الأكاديمية" data-en="Academy Student">طالب الأكاديمية</span>
                    </div>
                </div>

                <div class="sidebar-section-label" data-ar="التنقل" data-en="Navigation">التنقل</div>
                <nav class="portal-navigation">
                    <button class="nav-tab active" data-tab="overview" onclick="switchTab('overview')">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                        <span data-ar="الرئيسية" data-en="Overview">الرئيسية</span>
                    </button>
                    <button class="nav-tab" data-tab="courses" onclick="switchTab('courses')">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                        <span data-ar="دوراتي" data-en="My Courses">دوراتي</span>
                    </button>
                    <button class="nav-tab" data-tab="lectures" onclick="switchTab('lectures')">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        <span data-ar="المحاضرات" data-en="Lectures">المحاضرات</span>
                    </button>
                    <button class="nav-tab" data-tab="certificates" onclick="switchTab('certificates')">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="6"/><path d="M8.2 13.9 7 23l5-3 5 3-1.2-9.1"/></svg>
                        <span data-ar="شهاداتي" data-en="Certificates">شهاداتي</span>
                    </button>
                    <button class="nav-tab" data-tab="files" onclick="switchTab('files')">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        <span data-ar="ملفاتي" data-en="My Files">ملفاتي</span>
                    </button>
                </nav>

                <div class="sidebar-bottom">
                    <button class="sidebar-language" onclick="toggleLanguage()" id="langBtn">English</button>
                    <button class="sidebar-logout" onclick="handleLogout()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        <span data-ar="تسجيل الخروج" data-en="Logout">تسجيل الخروج</span>
                    </button>
                </div>
            </aside>

            <main class="portal-main">
                <header class="portal-mobile-header">
                    <img src="../images/logo_trans.png" alt="MakeFlow">
                    <div class="mobile-header-actions">
                        <button onclick="toggleLanguage()" id="mobileLangBtn">EN</button>
                        <button onclick="handleLogout()" aria-label="Logout">
                            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        </button>
                    </div>
                </header>

                <div class="portal-content">
                    <section class="portal-welcome">
                        <div>
                            <span class="welcome-kicker" data-ar="مساحتك التعليمية" data-en="Your learning space">مساحتك التعليمية</span>
                            <h1 id="welcomeTitle" data-ar="مرحباً بك 👋" data-en="Welcome 👋">مرحباً بك 👋</h1>
                            <p id="welcomeSubtitle" data-ar="تابع دوراتك ومحاضراتك وشهاداتك من مكان واحد" data-en="Access your courses, lectures and certificates in one place">تابع دوراتك ومحاضراتك وشهاداتك من مكان واحد</p>
                        </div>
                        <div class="welcome-decoration">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                        </div>
                    </section>

                    <section class="portal-stats" aria-label="Account summary">
                        <div class="portal-stat">
                            <div class="portal-stat-icon courses"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
                            <div><strong id="portalCoursesCount">0</strong><span data-ar="دورة متاحة" data-en="Available courses">دورة متاحة</span></div>
                        </div>
                        <div class="portal-stat">
                            <div class="portal-stat-icon lectures"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
                            <div><strong id="portalLecturesCount">0</strong><span data-ar="محاضرة" data-en="Lectures">محاضرة</span></div>
                        </div>
                        <div class="portal-stat">
                            <div class="portal-stat-icon certificates"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="6"/><path d="M8.2 13.9 7 23l5-3 5 3-1.2-9.1"/></svg></div>
                            <div><strong id="portalCertificatesCount">0</strong><span data-ar="شهادة" data-en="Certificates">شهادة</span></div>
                        </div>
                        <div class="portal-stat">
                            <div class="portal-stat-icon files"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
                            <div><strong id="portalFilesCount">0</strong><span data-ar="ملف مشترك" data-en="Shared files">ملف مشترك</span></div>
                        </div>
                    </section>

                    <div class="main-content" id="mainContent"></div>
                </div>

                <footer class="dashboard-footer">
                    <p data-ar="© 2026 MakeFlow Ai Academy. جميع الحقوق محفوظة" data-en="© 2026 MakeFlow Ai Academy. All rights reserved">© 2026 MakeFlow Ai Academy. جميع الحقوق محفوظة</p>
                </footer>
            </main>
        </div>

        <div class="video-modal hidden" id="videoModal" onclick="if(event.target===this)closeVideo()">
            <div class="modal-content">
                <button class="modal-close" onclick="closeVideo()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
                <h3 class="modal-title" id="modalTitle"></h3>
                <div class="video-wrapper" id="videoWrapper"></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="app.js?v=5"></script>
</body>
</html>
