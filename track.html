<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المسار — أكاديمية MakeFlow للذكاء الاصطناعي</title>
<link rel="icon" href="images/trans.png" type="image/png">
<meta name="description" content="تفاصيل المسار التدريبي في أكاديمية MakeFlow — الأكاديمية العربية الأولى المتخصصة بالذكاء الاصطناعي.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0D3B4C;
    --navy-deep: #082330;
    --navy-soft: #164658;
    --blue: #1D85B8;
    --blue-deep: #16688E;
    --teal: #3DB3BC;
    --teal-soft: #7FCDD3;
    --white: #FFFFFF;
    --paper: #FAFBFC;
    --paper-warm: #F5F7F8;
    --border: #E5E9EB;
    --border-soft: #EEF1F3;
    --gray-700: #3A4A52;
    --gray-500: #6B7A82;
    --green: #25D366;
    --grad-brand: linear-gradient(135deg, #3DB3BC 0%, #1D85B8 100%);
    --grad-brand-soft: linear-gradient(135deg, rgba(61,179,188,0.08) 0%, rgba(29,133,184,0.08) 100%);
    --shadow-card: 0 1px 2px rgba(13,59,76,0.04), 0 8px 24px rgba(13,59,76,0.06);
    --shadow-card-hover: 0 4px 8px rgba(13,59,76,0.06), 0 24px 48px rgba(13,59,76,0.12);
    --radius: 20px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

  body {
    font-family: 'Tajawal', 'Manrope', sans-serif;
    background: var(--white);
    color: var(--navy);
    line-height: 1.7;
    overflow-x: hidden;
  }

  body[data-lang="en"] { direction: ltr; font-family: 'Manrope', 'Tajawal', sans-serif; }

  ::selection { background: rgba(61,179,188,0.25); }

  /* ============ NAV ============ */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border-soft);
  }

  .nav-inner {
    max-width: 1240px;
    margin: 0 auto;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .nav-brand { display: flex; align-items: center; text-decoration: none; }
  .nav-brand img { height: 38px; width: auto; object-fit: contain; }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
    list-style: none;
  }

  .nav-links a {
    color: var(--gray-700);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--blue); }

  .nav-actions { display: flex; align-items: center; gap: 14px; }

  .lang-toggle {
    display: flex;
    background: var(--paper-warm);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 3px;
  }

  .lang-toggle button {
    border: none;
    background: transparent;
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    color: var(--gray-500);
    font-family: inherit;
    transition: all 0.25s;
  }

  .lang-toggle button.active { background: var(--navy); color: var(--white); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 26px;
    border-radius: 100px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: transform 0.2s, box-shadow 0.2s;
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--grad-brand);
    color: var(--white);
    box-shadow: 0 4px 16px rgba(29,133,184,0.28);
  }

  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(29,133,184,0.36); }

  .btn-whatsapp {
    background: var(--green);
    color: var(--white);
    box-shadow: 0 4px 16px rgba(37,211,102,0.3);
  }

  .btn-whatsapp:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37,211,102,0.4); }

  .btn-ghost {
    background: transparent;
    color: var(--navy);
    border: 1.5px solid var(--border);
  }

  .btn-ghost:hover { border-color: var(--teal); color: var(--blue); }

  .nav-cta { padding: 10px 22px; font-size: 14px; }

  /* ============ TRACK HERO ============ */
  .track-hero {
    background: var(--navy-deep);
    position: relative;
    overflow: hidden;
    color: var(--white);
  }

  .track-hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 75% at 85% 10%, rgba(61,179,188,0.2) 0%, transparent 60%),
      radial-gradient(ellipse 45% 65% at 5% 95%, rgba(29,133,184,0.18) 0%, transparent 60%);
  }

  .track-hero-inner {
    max-width: 1240px;
    margin: 0 auto;
    padding: 72px 28px 84px;
    position: relative;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 64px;
    align-items: center;
  }

  .breadcrumb {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    color: rgba(255,255,255,0.55);
    margin-bottom: 24px;
    text-decoration: none;
    transition: color 0.2s;
  }

  .breadcrumb:hover { color: var(--teal-soft); }

  .breadcrumb svg { flex-shrink: 0; }

  .track-badges { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }

  .badge {
    font-size: 12.5px;
    font-weight: 800;
    padding: 6px 15px;
    border-radius: 100px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .badge-level-beginner { background: rgba(61,179,188,0.18); color: var(--teal-soft); }
  .badge-level-intermediate { background: rgba(245,158,11,0.18); color: #FCD34D; }
  .badge-level-advanced { background: rgba(255,255,255,0.12); color: var(--white); }

  .badge-meta {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    color: rgba(255,255,255,0.85);
  }

  .track-hero h1 {
    font-size: clamp(32px, 4.2vw, 52px);
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 20px;
    letter-spacing: -0.5px;
  }

  .track-hero-desc {
    font-size: 17.5px;
    color: rgba(255,255,255,0.75);
    line-height: 1.9;
    margin-bottom: 34px;
    max-width: 580px;
  }

  .track-hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; }

  .track-hero-visual {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .track-icon-big {
    width: 200px; height: 200px;
    border-radius: 40px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--teal-soft);
    position: relative;
    animation: floaty 5s ease-in-out infinite;
  }

  .track-icon-big::before {
    content: "";
    position: absolute;
    inset: -14px;
    border-radius: 50px;
    border: 1.5px dashed rgba(61,179,188,0.35);
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-12px) rotate(2deg); }
  }

  /* ============ CONTENT ============ */
  .content-wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding: 80px 28px;
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 48px;
    align-items: start;
  }

  .content-block { margin-bottom: 56px; }

  .content-block:last-child { margin-bottom: 0; }

  .block-title {
    font-size: 26px;
    font-weight: 900;
    color: var(--navy-deep);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .block-title::before {
    content: "";
    width: 6px; height: 28px;
    background: var(--grad-brand);
    border-radius: 4px;
    flex-shrink: 0;
  }

  /* Outcomes */
  .outcomes-list { display: flex; flex-direction: column; gap: 14px; }

  .outcome-item {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--paper);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 18px 20px;
    font-size: 15.5px;
    color: var(--gray-700);
    line-height: 1.8;
    transition: border-color 0.25s, transform 0.25s;
  }

  .outcome-item:hover { border-color: rgba(61,179,188,0.4); transform: translateX(-4px); }
  body[data-lang="en"] .outcome-item:hover { transform: translateX(4px); }

  .outcome-check {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--grad-brand);
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }

  /* Curriculum */
  .module {
    display: flex;
    gap: 20px;
    padding: 26px;
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    margin-bottom: 16px;
    box-shadow: var(--shadow-card);
    transition: transform 0.25s, box-shadow 0.25s;
  }

  .module:hover { transform: translateY(-3px); box-shadow: var(--shadow-card-hover); }

  .module-num {
    width: 48px; height: 48px;
    border-radius: 14px;
    background: var(--grad-brand-soft);
    border: 1px solid rgba(61,179,188,0.25);
    color: var(--blue-deep);
    font-size: 18px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
  }

  .module-title { font-size: 17.5px; font-weight: 800; color: var(--navy-deep); margin-bottom: 6px; }
  .module-desc { font-size: 14.5px; color: var(--gray-500); line-height: 1.8; }

  /* Audience */
  .audience-box {
    background: var(--grad-brand-soft);
    border: 1px solid rgba(61,179,188,0.25);
    border-radius: var(--radius);
    padding: 28px;
    font-size: 16px;
    color: var(--navy-soft);
    line-height: 1.9;
  }

  /* Tools */
  .tools-list { display: flex; flex-wrap: wrap; gap: 10px; }

  .tool-tag {
    font-size: 14px;
    font-weight: 700;
    padding: 9px 20px;
    border-radius: 100px;
    background: var(--white);
    border: 1.5px solid var(--border);
    color: var(--navy-soft);
    transition: border-color 0.25s, color 0.25s, transform 0.25s;
  }

  .tool-tag:hover { border-color: var(--teal); color: var(--blue); transform: translateY(-2px); }

  /* ============ SIDEBAR ============ */
  .sidebar {
    position: sticky;
    top: 100px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .enroll-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 30px;
    box-shadow: var(--shadow-card-hover);
  }

  .enroll-price-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--gray-500);
    margin-bottom: 8px;
  }

  .enroll-price {
    font-size: 38px;
    font-weight: 900;
    color: var(--navy-deep);
    line-height: 1;
    margin-bottom: 4px;
  }

  .enroll-price small { font-size: 15px; font-weight: 700; color: var(--gray-500); }

  .enroll-note {
    font-size: 13px;
    color: var(--gray-500);
    margin-bottom: 22px;
    padding-bottom: 20px;
    border-bottom: 1px dashed var(--border);
  }

  .enroll-includes { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }

  .enroll-include {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--gray-700);
    font-weight: 600;
  }

  .enroll-include svg { color: var(--teal); flex-shrink: 0; }

  .enroll-card .btn { width: 100%; margin-bottom: 10px; }


  /* ============ OTHER TRACKS ============ */
  .other-tracks { background: var(--paper); }

  .other-tracks-inner {
    max-width: 1240px;
    margin: 0 auto;
    padding: 72px 28px;
  }

  .other-title {
    font-size: 24px;
    font-weight: 900;
    color: var(--navy-deep);
    margin-bottom: 30px;
  }

  .other-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  .other-card {
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    padding: 22px;
    text-decoration: none;
    color: inherit;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
  }

  .other-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-card-hover);
    border-color: rgba(61,179,188,0.4);
  }

  .other-icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: var(--grad-brand-soft);
    color: var(--blue);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .other-name { font-size: 15.5px; font-weight: 800; color: var(--navy-deep); line-height: 1.4; }
  .other-meta { font-size: 12.5px; color: var(--gray-500); margin-top: 3px; }

  /* ============ FOOTER ============ */
  footer { background: var(--navy-deep); border-top: 1px solid rgba(255,255,255,0.08); }

  .footer-inner {
    max-width: 1240px;
    margin: 0 auto;
    padding: 44px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .footer-inner img { height: 32px; width: auto; filter: brightness(0) invert(1); }

  .footer-copy { font-size: 13px; color: rgba(255,255,255,0.45); }

  .footer-contact { display: flex; gap: 18px; align-items: center; }

  .footer-contact a {
    color: rgba(255,255,255,0.65);
    text-decoration: none;
    font-size: 13.5px;
    transition: color 0.2s;
  }

  .footer-contact a:hover { color: var(--teal-soft); }

  /* ============ NOT FOUND ============ */
  .not-found {
    max-width: 560px;
    margin: 0 auto;
    padding: 120px 28px;
    text-align: center;
  }

  .not-found h1 { font-size: 30px; font-weight: 900; margin-bottom: 14px; }
  .not-found p { color: var(--gray-500); margin-bottom: 28px; }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 1024px) {
    .track-hero-inner { grid-template-columns: 1fr; gap: 40px; }
    .track-hero-visual { display: none; }
    .content-wrap { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .other-grid { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 720px) {
    .nav-links { display: none; }
    .nav-cta { display: none; }
    .track-hero-inner { padding: 52px 22px 60px; }
    .content-wrap { padding: 56px 22px; }
    .other-grid { grid-template-columns: 1fr; }
    .footer-inner { justify-content: center; text-align: center; }
  }
</style>
</head>
